<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
</style>
<h2 class="sr-only">Sequence diagram: BackupApp orchestrates scanning, then runs parallel BackupTask copies that log through BackupLogger before ReportGenerator builds the summary.</h2>
<div id="seq"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('seq-svg', `sequenceDiagram
    participant App as BackupApp
    participant Scanner as FileScanner
    participant Engine as BackupEngine
    participant Task as BackupTask
    participant Logger as BackupLogger
    participant Report as ReportGenerator
    App->>Scanner: scan(sourceDir)
    Scanner-->>App: List of FileMetadata
    App->>Engine: runBackup(files, config)
    Engine->>Engine: create fixed thread pool
    par For each file, in parallel
        Engine->>Task: submit copy task
        Task->>Task: Files.copy(source, dest)
        Task->>Logger: log(result)
        Task-->>Engine: BackupResult
    end
    Engine->>Report: generate(results)
    Report-->>App: summary printed to console`);
document.getElementById('seq').innerHTML = svg;
</script>
